<div class="flex flex-column justify-content-between">
  <label class="col-6" [for]="id">{{ label }}</label>
  <p-password
    [formControl]="control"
    [inputId]="id"
    [placeholder]="placeholder"
    [toggleMask]="true"
    autocomplete="current-password"
    fluid="true"
  ></p-password>
</div>
