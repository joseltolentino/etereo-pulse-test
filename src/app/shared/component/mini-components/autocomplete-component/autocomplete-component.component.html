<div class="flex flex-col gap-3 mb-2">
  <label class="col-6" [for]="id">{{ label }}</label>
  <p-autocomplete
    [inputId]="id"
    [formControl]="control"
    [suggestions]="filteredOptions"
    (completeMethod)="filter($event)"
    [field]="'label'"
    [placeholder]="placeholder"
    [dropdown]="true"
  />
</div>
