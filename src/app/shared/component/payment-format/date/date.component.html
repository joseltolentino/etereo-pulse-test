<fieldset class="m-4 border-round">
  <div class="p-4">
    <div class="flex justify-content-between align-items-center mb-2">
      <h2 class="text-white">Fecha</h2>
      <p-datepicker
        [formControl]="dateControl"
        [showIcon]="true"
        dateFormat="dd/mm/yy"
      ></p-datepicker>
    </div>

    <!-- 📅 Fecha formateada -->
    <p class="text-white mb-3 flex align-items-center gap-2">
      <i class="pi pi-calendar"></i>
      <span>Hoy: {{ formattedDate() }}</span>
    </p>

    <div class="flex justify-content-end gap-2 mb-3">
      <p-button icon="pi pi-angle-left" (click)="previousDay()"></p-button>
      <p-button icon="pi pi-angle-right" (click)="nextDay()"></p-button>
    </div>

    <h4 class="text-white mb-2">Selecciona la hora</h4>

    <p-card>
      <p-accordion>
        <p-accordion-panel *ngFor="let grupo of grupos" [value]="grupo">
          <p-accordion-header>{{ grupo | titlecase }}</p-accordion-header>
          <p-accordion-content>
            <div class="overflow-x-auto pt-1">
              <div class="flex flex-wrap gap-1">
                <p-button
                  *ngFor="let hora of turnos[grupo]"
                  [label]="hora.label"
                  [outlined]="!isSelected(hora.value)"
                  [severity]="isSelected(hora.value) ? 'success' : 'secondary'"
                  (click)="selectHora(hora.value)"
                ></p-button>
              </div>
            </div>
          </p-accordion-content>
        </p-accordion-panel>
      </p-accordion>
    </p-card>

    <div class="flex justify-content-end mt-3 gap-2">
      <p-button
        styleClass="pButton"
        label="Atrás"
        severity="secondary"
      ></p-button>
      <p-button
        styleClass="pButton"
        label="Continuar"
        severity="primary"
        [disabled]="!selectedHora"
      ></p-button>
    </div>
  </div>
</fieldset>
