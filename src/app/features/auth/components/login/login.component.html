<div class="fndo-login flex justify-content-center align-items-center px-4">
  <p-card
    [style]="{
      width: '25rem',
      height: '25rem',
      overflow: 'hidden',
      background: 'transparent',
      border: 'solid 1px white'
    }"
  >
    <div class="">
      <div class="w-full">
        <h2 class="text-2xl font-bold mb-4 text-white">Login</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div class="field mb-3">
            <label for="username" class="text-white">Usuario</label>
            <input
              id="username"
              pInputText
              inputtext.color="bg-blue-90"
              variant="filled"
              formControlName="username"
              class="w-full"
              autocomplete="current-username"
              placeholder="Ingrese su usuario"
            />
            <small
              *ngIf="
                loginForm.get('username')?.touched &&
                loginForm.get('username')?.invalid
              "
              class="text-red-500"
            >
              Usuario es requerido
            </small>
          </div>

          <div class="field mb-3">
            <label for="password" class="text-white">Contraseña</label>
            <p-password
              formControlName="password"
              inputId="password"
              [feedback]="false"
              [toggleMask]="true"
              class="w-full"
              autocomplete="current-password"
              placeholder="Ingrese su contraseña"
              fluid="true"
            />
            <small
              *ngIf="
                loginForm.get('password')?.touched &&
                loginForm.get('password')?.invalid
              "
              class="text-red-500"
            >
              Contraseña es requerida
            </small>
          </div>

          <button
            pButton
            type="submit"
            label="Ingresar"
            class="w-full"
            [disabled]="loginForm.invalid"
          ></button>
          <div class="mt-3 text-right text-red-600">
            ¿No tienes una cuenta?
            <a
              routerLink="/register"
              routerLinkActive="active"
              class="no-underline text-white cursor-pointer"
              >Regístrate aquí</a
            >
          </div>
        </form>
      </div>
      <p-toast></p-toast>
    </div>
  </p-card>
</div>
